<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rongdhanu Technology — Business ERP V2</title>
<style>
:root{--nav:#071d35;--blue:#1677ed;--bg:#f4f7fb;--line:#e1e7ef;--text:#182337;--muted:#748196}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,Helvetica,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061a30,#123d68)}
.loginbox{width:min(420px,92%);background:#fff;border-radius:16px;padding:32px;box-shadow:0 20px 60px #0005}.brand{font-size:21px;font-weight:800;letter-spacing:1px}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:0;margin-top:5px}.login h2{margin:28px 0 8px}.login p{color:var(--muted)}.login input{margin-bottom:12px}
.layout{display:flex}.sidebar{width:245px;position:fixed;inset:0 auto 0 0;background:var(--nav);color:#fff;padding:18px 12px;overflow:auto}.logo{padding:8px 10px 18px;font-weight:800;font-size:18px}.logo small{display:block;font-weight:400;font-size:10px;margin-top:5px;color:#b9cbe0}.nav button{display:block;width:100%;border:0;background:none;color:#d8e5f2;padding:10px 12px;border-radius:8px;text-align:left;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:var(--blue);color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:10px 14px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700}.btn.secondary{background:#e8eef6;color:#26344a}.btn.red{background:#e64c4c}.btn.green{background:#229653}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #12213d0b}.card{padding:16px}.metric{font-size:24px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.panel{padding:17px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}th{background:#f8fafc;color:#56647a;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f2ff;color:#1767c0;font-size:11px}.badge.green{background:#e7f7ed;color:#207f46}.badge.red{background:#fdeaea;color:#c53131}.badge.orange{background:#fff3dc;color:#9c6500}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#56647a}input,select,textarea{width:100%;border:1px solid #d7dfeb;border-radius:7px;padding:9px;margin-top:5px;background:#fff}textarea{min-height:75px}.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.line{display:grid;grid-template-columns:2fr 1fr 1fr 40px;gap:8px;align-items:end;margin-bottom:8px}.totalbox{max-width:360px;margin-left:auto;margin-top:15px}.totalrow{display:flex;justify-content:space-between;padding:7px 0}.totalrow.grand{font-size:18px;font-weight:800;border-top:2px solid var(--line);margin-top:5px}.search{max-width:300px}.footer{margin:24px;text-align:center;color:#8995a6;font-size:11px}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:10}.modalbox{width:min(700px,94%);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;padding:20px}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}
.invoice-paper{background:#fff;padding:35px;max-width:850px;margin:auto}.invoice-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:15px}.invoice-head h1{margin:0}.right{text-align:right}.invoice-paper table{margin-top:20px}.invoice-paper .sum{width:300px;margin-left:auto}.sign{display:flex;justify-content:space-between;margin-top:70px}.no-print{display:block}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.sidebar{width:68px}.logo{font-size:0}.logo:after{content:"RT";font-size:22px}.nav button{font-size:0;text-align:center}.nav button:before{content:"●";font-size:14px}.main{margin-left:68px;width:calc(100% - 68px);padding:12px}.cards,.formgrid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.line{grid-template-columns:1fr}}
@media print{body{background:#fff}.sidebar,.top,.no-print,.footer{display:none!important}.main{margin:0;width:100%;padding:0}.invoice-paper{max-width:none;box-shadow:none}}
</style>
</head>
<body>
<div id="login" class="login">
<div class="loginbox">
<div class="brand">RONGDHANU TECHNOLOGY<small>Fire Door & Fire Safety Solution</small></div>
<h2>Business ERP V2</h2><p>Demo login — choose a role to test permissions.</p>
<select id="loginRole"><option>Admin</option><option>Sales</option><option>Store</option><option>Accounts</option></select>
<input id="loginUser" placeholder="Username" value="admin">
<input id="loginPass" type="password" placeholder="Password" value="1234">
<button class="btn" style="width:100%" onclick="login()">Login</button>
<p class="muted">Demo password: 1234</p>
</div></div>

<div id="app" class="hidden">
<div class="layout">
<aside class="sidebar"><div class="logo">RONGDHANU TECHNOLOGY<small>Fire Door & Fire Safety Solution</small></div><div class="nav" id="nav"></div>
<div style="margin:20px 7px 0;color:#9fb1c7;font-size:11px">Logged in as <b id="roleLabel"></b><br><button onclick="logout()" style="margin-top:8px;background:none;border:0;color:#fff;cursor:pointer;padding:0">Logout</button></div>
</aside>
<main class="main">
<div class="top"><div><h1 id="title">Dashboard</h1><p id="sub">Business overview</p></div><div class="actions"><button class="btn secondary" onclick="window.print()">Print</button><button class="btn" onclick="go('quotation')">+ Quotation</button></div></div>
<div id="content"></div><div class="footer">Rongdhanu Technology • Business Management System V2</div>
</main></div></div>

<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>

<script>
const menu=[
['dashboard','🏠','Dashboard'],['customers','👥','Customers'],['suppliers','🏭','Suppliers'],['inventory','📦','Inventory'],
['quotation','🧾','Price Offer / Quotation'],['workorders','📋','Work Orders'],['challan','🚚','Challans'],['invoice','💰','Sales / Invoice'],
['purchase','🛒','Purchases'],['projects','🏗️','Projects'],['accounts','💵','Accounts'],['reports','📊','Reports'],['settings','⚙️','Settings']
];
const permissions={Admin:menu.map(x=>x[0]),Sales:['dashboard','customers','quotation','workorders','invoice','projects'],Store:['dashboard','inventory','challan','purchase','projects'],Accounts:['dashboard','customers','suppliers','invoice','purchase','accounts','reports']};
let role='Admin';
let db=JSON.parse(localStorage.getItem('rt_erp_v2')||'null')||{
company:{name:'Rongdhanu Technology',tag:'Fire Door & Fire Safety Solution',address:'Dhaka, Bangladesh',mobile:'+880 1711-017270',email:'info@rongdhanutechnology.com',bin:'',tin:''},
customers:[],suppliers:[],products:[
{code:'FD-001',name:'UL Listed Fire Door',cat:'Fire Door',unit:'PCS',buy:22000,sell:25000,stock:25,min:5},
{code:'DC-001',name:'Door Closer',cat:'Door Accessory',unit:'PCS',buy:1800,sell:2500,stock:50,min:10},
{code:'PB-001',name:'Panic Bar',cat:'Door Accessory',unit:'PCS',buy:2700,sell:3500,stock:30,min:8},
{code:'HL-001',name:'Handle Lock',cat:'Door Accessory',unit:'PCS',buy:1500,sell:2200,stock:45,min:10},
{code:'HG-001',name:'Door Hinge',cat:'Door Accessory',unit:'PCS',buy:500,sell:800,stock:100,min:20},
{code:'VG-001',name:'Vision Glass',cat:'Fire Door',unit:'PCS',buy:2800,sell:4000,stock:12,min:5}],
quotations:[],workorders:[],challans:[],invoices:[],purchases:[],transactions:[],projects:[],expenses:[]
};
function save(){localStorage.setItem('rt_erp_v2',JSON.stringify(db))}
function money(n){return '৳ '+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function num(prefix,arr){return prefix+'-'+String(arr.length+1).padStart(5,'0')}
function login(){role=document.getElementById('loginRole').value;if(document.getElementById('loginPass').value!=='1234'){alert('Demo password is 1234');return}sessionStorage.setItem('rt_role',role);document.getElementById('roleLabel').textContent=role;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');buildNav();go('dashboard')}
function logout(){sessionStorage.removeItem('rt_role');location.reload()}
function buildNav(){document.getElementById('nav').innerHTML=menu.filter(x=>permissions[role].includes(x[0])).map(x=>`<button data-page="${x[0]}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
function go(page){if(!permissions[role].includes(page)){alert('You do not have permission for this module.');return}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let m=menu.find(x=>x[0]===page);document.getElementById('title').textContent=m[2];document.getElementById('sub').textContent=page==='dashboard'?'Business overview':'Manage '+m[2].toLowerCase();({dashboard,customers,suppliers,inventory,quotation,workorders,challan,invoice,purchase,projects,accounts,reports,settings}[page])()}
function dashboard(){let sales=db.invoices.reduce((s,x)=>s+x.total,0),paid=db.invoices.reduce((s,x)=>s+x.paid,0),purchase=db.purchases.reduce((s,x)=>s+x.total,0),stock=db.products.reduce((s,x)=>s+x.stock*x.buy,0),low=db.products.filter(x=>x.stock<=x.min);content.innerHTML=`<div class="cards">
<div class="card"><div class="muted">Total Sales</div><div class="metric">${money(sales)}</div></div><div class="card"><div class="muted">Total Collection</div><div class="metric">${money(paid)}</div></div>
<div class="card"><div class="muted">Customer Due</div><div class="metric">${money(sales-paid)}</div></div><div class="card"><div class="muted">Stock Value</div><div class="metric">${money(stock)}</div></div></div>
<div class="grid2"><div class="panel"><h2>Recent Invoices</h2>${invoiceTable(db.invoices.slice().reverse().slice(0,7))}</div><div class="panel"><h2>Low Stock</h2>${low.length?`<table><tr><th>Product</th><th>Stock</th></tr>${low.map(p=>`<tr><td>${p.name}</td><td><span class="badge red">${p.stock} ${p.unit}</span></td></tr>`).join('')}</table>`:'<div class="muted">No low-stock items.</div>'}</div></div>
<div class="panel"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="go('quotation')">New Quotation</button><button class="btn" onclick="go('invoice')">New Invoice</button><button class="btn" onclick="go('challan')">New Challan</button><button class="btn secondary" onclick="go('inventory')">Stock In/Out</button><button class="btn secondary" onclick="go('accounts')">Accounts</button></div></div>`}
function invoiceTable(a){return a.length?`<div class="tablewrap"><table><tr><th>No.</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th></th></tr>${a.map(x=>`<tr><td>${x.no}</td><td>${x.customer}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.total-x.paid)}</td><td><button class="btn secondary" onclick="preview('invoice','${x.no}')">View</button></td></tr>`).join('')}</table></div>`:'<div class="muted">No invoices yet.</div>'}
function customers(){master('customers','Customer','Company Name','Mobile')}
function suppliers(){master('suppliers','Supplier','Company Name','Mobile')}
function projects(){master('projects','Project','Project Name','Customer')}
function master(key,label,f1,f2){content.innerHTML=`<div class="panel"><h2>Add ${label}</h2><form onsubmit="addMaster(event,'${key}')"><div class="formgrid"><div><label>${f1}</label><input name="name" required></div><div><label>${f2}</label><input name="contact"></div><div><label>Email</label><input name="email"></div><div class="full"><label>Address / Details</label><textarea name="details"></textarea></div></div><div class="form-actions"><button class="btn">Save ${label}</button></div></form></div><div class="panel"><h2>${label} List</h2><div class="tablewrap"><table><tr><th>#</th><th>Name</th><th>${f2}</th><th>Email</th><th>Details</th></tr>${db[key].map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.contact||''}</td><td>${x.email||''}</td><td>${x.details||''}</td></tr>`).join('')}</table></div></div>`}
function addMaster(e,key){e.preventDefault();let f=new FormData(e.target);db[key].push({name:f.get('name'),contact:f.get('contact'),email:f.get('email'),details:f.get('details')});save();go(key)}
function inventory(){content.innerHTML=`<div class="panel"><div class="top"><h2>Inventory & Stock</h2><div class="actions"><button class="btn" onclick="toggle('productForm')">+ Product</button><button class="btn secondary" onclick="stockMove()">Stock In/Out</button></div></div>
<form id="productForm" class="hidden" onsubmit="addProduct(event)"><div class="formgrid"><div><label>Product Code</label><input name="code" required></div><div><label>Product Name</label><input name="name" required></div><div><label>Category</label><input name="cat"></div><div><label>Unit</label><input name="unit" value="PCS"></div><div><label>Purchase Price</label><input name="buy" type="number" step=".01"></div><div><label>Sales Price</label><input name="sell" type="number" step=".01"></div><div><label>Opening Stock</label><input name="stock" type="number"></div><div><label>Minimum Stock</label><input name="min" type="number" value="5"></div></div><div class="form-actions"><button class="btn">Save Product</button></div></form>
<div class="tablewrap"><table><tr><th>Code</th><th>Product</th><th>Category</th><th>Buy</th><th>Sell</th><th>Stock</th><th>Status</th></tr>${db.products.map(p=>`<tr><td>${p.code}</td><td>${p.name}</td><td>${p.cat||''}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td>${p.stock} ${p.unit}</td><td>${p.stock<=p.min?'<span class="badge red">Low</span>':'<span class="badge green">OK</span>'}</td></tr>`).join('')}</table></div></div>`}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);db.products.push({code:f.get('code'),name:f.get('name'),cat:f.get('cat'),unit:f.get('unit'),buy:+f.get('buy')||0,sell:+f.get('sell')||0,stock:+f.get('stock')||0,min:+f.get('min')||0});save();go('inventory')}
function stockMove(){modalBody.innerHTML=`<h2>Stock In / Out</h2><form onsubmit="doStock(event)"><div class="formgrid"><div><label>Product</label><select name="p">${db.products.map((p,i)=>`<option value="${i}">${p.name} — Stock ${p.stock}</option>`).join('')}</select></div><div><label>Type</label><select name="type"><option>Stock In</option><option>Stock Out</option><option>Adjustment</option></select></div><div><label>Quantity</label><input name="qty" type="number" min="1" required></div><div class="full"><label>Reason</label><textarea name="reason"></textarea></div></div><div class="form-actions"><button class="btn">Update Stock</button></div></form>`;openModal()}
function doStock(e){e.preventDefault();let f=new FormData(e.target),p=db.products[+f.get('p')],q=+f.get('qty'),t=f.get('type');if(t==='Stock In')p.stock+=q;else p.stock=Math.max(0,p.stock-q);save();closeModal();go('inventory')}
function productOptions(){return db.products.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('')}
function itemLine(prefix){return `<div class="line"><div><label>Product</label><select name="${prefix}p">${productOptions()}</select></div><div><label>Qty</label><input name="${prefix}q" type="number" min="1" value="1" oninput="recalc()"></div><div><label>Rate</label><input name="${prefix}r" type="number" step=".01" value="${db.products[0]?.sell||0}" oninput="recalc()"></div><button type="button" class="btn red" onclick="this.parentElement.remove();recalc()">×</button></div>`}
function quotation(){content.innerHTML=`<div class="panel"><h2>Create Price Offer / Quotation</h2><form id="qform" onsubmit="saveQuotation(event)"><div class="formgrid"><div><label>Customer</label><input name="customer" required></div><div><label>Project</label><input name="project"></div><div><label>Date</label><input name="date" type="date" value="${today()}"></div></div><div id="qlines" style="margin-top:14px">${itemLine('q')}</div><button type="button" class="btn secondary" onclick="qlines.insertAdjacentHTML('beforeend',itemLine('q'))">+ Add Item</button><div class="totalbox"><div class="totalrow"><span>Subtotal</span><b id="qsub">৳ 0</b></div><div class="totalrow"><span>Discount</span><input style="width:150px" id="qdisc" name="discount" type="number" value="0" oninput="recalc()"></div><div class="totalrow"><span>VAT %</span><input style="width:150px" id="qvat" name="vat" type="number" value="0" oninput="recalc()"></div><div class="totalrow grand"><span>Grand Total</span><b id="qgrand">৳ 0</b></div></div><div class="form-actions"><button class="btn">Save Quotation</button></div></form></div><div class="panel"><h2>Quotation History</h2>${db.quotations.length?`<table><tr><th>No.</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr>${db.quotations.slice().reverse().map(q=>`<tr><td>${q.no}</td><td>${q.date}</td><td>${q.customer}</td><td>${money(q.total)}</td><td><span class="badge orange">${q.status}</span></td><td><button class="btn secondary" onclick="preview('quotation','${q.no}')">View/Print</button></td></tr>`).join('')}</table>`:'<div class="muted">No quotations yet.</div>'}</div>`;recalc()}
function getLines(prefix){return [...document.querySelectorAll('#'+(prefix==='q'?'qlines':'ilines')+' .line')].map(r=>({p:+r.querySelector(`[name="${prefix}p"]`).value,q:+r.querySelector(`[name="${prefix}q"]`).value,r:+r.querySelector(`[name="${prefix}r"]`).value})).filter(x=>x.q>0)}
function recalc(){let box=document.getElementById('qlines');if(!box)return;let sub=getLines('q').reduce((s,x)=>s+x.q*x.r,0),d=+document.getElementById('qdisc').value||0,v=+document.getElementById('qvat').value||0,total=(sub-d)*(1+v/100);qsub.textContent=money(sub);qgrand.textContent=money(total)}
function saveQuotation(e){e.preventDefault();let f=new FormData(e.target),lines=getLines('q'),sub=lines.reduce((s,x)=>s+x.q*x.r,0),d=+f.get('discount')||0,v=+f.get('vat')||0,total=(sub-d)*(1+v/100);db.quotations.push({no:num('RT-QUO',db.quotations),date:f.get('date'),customer:f.get('customer'),project:f.get('project'),lines,discount:d,vat:v,total,status:'Pending'});save();go('quotation')}
function workorders(){content.innerHTML=`<div class="panel"><h2>Create Work Order</h2><form onsubmit="saveWO(event)"><div class="formgrid"><div><label>Customer</label><input name="customer" required></div><div><label>Project</label><input name="project"></div><div><label>Advance %</label><input name="advance" type="number" value="55"></div><div><label>Delivery Timeline</label><input name="delivery" value="08 Days after received the Work Order"></div><div class="full"><label>Notes / Terms</label><textarea name="notes"></textarea></div></div><button class="btn" style="margin-top:12px">Save Work Order</button></form></div><div class="panel"><h2>Work Order History</h2>${db.workorders.length?`<table><tr><th>No.</th><th>Customer</th><th>Project</th><th>Advance</th><th>Delivery</th><th>Status</th></tr>${db.workorders.slice().reverse().map(w=>`<tr><td>${w.no}</td><td>${w.customer}</td><td>${w.project||''}</td><td>${w.advance}%</td><td>${w.delivery}</td><td><span class="badge">${w.status}</span></td></tr>`).join('')}</table>`:'<div class="muted">No work orders yet.</div>'}</div>`}
function saveWO(e){e.preventDefault();let f=new FormData(e.target);db.workorders.push({no:num('RT-WO',db.workorders),date:today(),customer:f.get('customer'),project:f.get('project'),advance:f.get('advance'),delivery:f.get('delivery'),notes:f.get('notes'),status:'Pending'});save();go('workorders')}
function challan(){content.innerHTML=`<div class="panel"><h2>Create Delivery / Replacement Challan</h2><form onsubmit="saveChallan(event)"><div class="formgrid"><div><label>Customer</label><input name="customer" required></div><div><label>Project</label><input name="project"></div><div><label>Type</label><select name="type"><option>Delivery Challan</option><option>Replacement Challan</option></select></div></div><div id="clines" style="margin-top:14px">${itemLine('c')}</div><button type="button" class="btn secondary" onclick="clines.insertAdjacentHTML('beforeend',itemLine('c'))">+ Add Item</button><div class="form-actions"><button class="btn">Save Challan</button></div></form></div><div class="panel"><h2>Challan History</h2>${db.challans.length?`<table><tr><th>No.</th><th>Type</th><th>Customer</th><th>Project</th><th>Date</th><th></th></tr>${db.challans.slice().reverse().map(x=>`<tr><td>${x.no}</td><td>${x.type}</td><td>${x.customer}</td><td>${x.project||''}</td><td>${x.date}</td><td><button class="btn secondary" onclick="preview('challan','${x.no}')">View/Print</button></td></tr>`).join('')}</table>`:'<div class="muted">No challans yet.</div>'}</div>`}
function saveChallan(e){e.preventDefault();let f=new FormData(e.target),lines=getLines('c').map(x=>{let p=db.products[x.p];p.stock=Math.max(0,p.stock-x.q);return {product:p.name,qty:x.q}});db.challans.push({no:num('RT-CH',db.challans),date:today(),customer:f.get('customer'),project:f.get('project'),type:f.get('type'),lines});save();go('challan')}
function invoice(){content.innerHTML=`<div class="panel"><h2>Create Sales Invoice</h2><form id="iform" onsubmit="saveInvoice(event)"><div class="formgrid"><div><label>Customer</label><input name="customer" required></div><div><label>Date</label><input name="date" type="date" value="${today()}"></div><div><label>Paid Amount</label><input name="paid" type="number" value="0" step=".01"></div></div><div id="ilines" style="margin-top:14px">${itemLine('i')}</div><button type="button" class="btn secondary" onclick="ilines.insertAdjacentHTML('beforeend',itemLine('i'))">+ Add Item</button><div class="totalbox"><div class="totalrow"><span>Subtotal</span><b id="isub">৳ 0</b></div><div class="totalrow"><span>Discount</span><input style="width:150px" id="idisc" name="discount" type="number" value="0" oninput="irecalc()"></div><div class="totalrow"><span>VAT %</span><input style="width:150px" id="ivat" name="vat" type="number" value="0" oninput="irecalc()"></div><div class="totalrow grand"><span>Grand Total</span><b id="igrand">৳ 0</b></div></div><div class="form-actions"><button class="btn">Save Invoice</button></div></form></div><div class="panel"><h2>Invoice History</h2>${invoiceTable(db.invoices.slice().reverse())}</div>`;irecalc()}
function irecalc(){let box=document.getElementById('ilines');if(!box)return;let sub=getLines('i').reduce((s,x)=>s+x.q*x.r,0),d=+idisc.value||0,v=+ivat.value||0,total=(sub-d)*(1+v/100);isub.textContent=money(sub);igrand.textContent=money(total)}
function saveInvoice(e){e.preventDefault();let f=new FormData(e.target),lines=getLines('i'),sub=lines.reduce((s,x)=>s+x.q*x.r,0),d=+f.get('discount')||0,v=+f.get('vat')||0,total=(sub-d)*(1+v/100),paid=+f.get('paid')||0;lines.forEach(x=>db.products[x.p].stock=Math.max(0,db.products[x.p].stock-x.q));let no=num('RT-INV',db.invoices);db.invoices.push({no,date:f.get('date'),customer:f.get('customer'),lines,discount:d,vat:v,total,paid});db.transactions.push({ref:num('RC',db.transactions),type:'Receipt',party:f.get('customer'),amount:paid,date:f.get('date')});save();preview('invoice',no)}
function purchase(){content.innerHTML=`<div class="panel"><h2>Purchase / Stock In</h2><form onsubmit="savePurchase(event)"><div class="formgrid"><div><label>Supplier</label><input name="supplier" required></div><div><label>Product</label><select name="p">${productOptions()}</select></div><div><label>Quantity</label><input name="q" type="number" value="1" min="1"></div><div><label>Purchase Rate</label><input name="rate" type="number" step=".01"></div><div><label>Paid</label><input name="paid" type="number" value="0" step=".01"></div></div><button class="btn" style="margin-top:12px">Save Purchase & Stock In</button></form></div><div class="panel"><h2>Purchase History</h2><table><tr><th>No.</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Total</th><th>Paid</th><th>Due</th></tr>${db.purchases.slice().reverse().map(x=>`<tr><td>${x.no}</td><td>${x.supplier}</td><td>${x.product}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.total-x.paid)}</td></tr>`).join('')}</table></div>`}
function savePurchase(e){e.preventDefault();let f=new FormData(e.target),p=db.products[+f.get('p')],q=+f.get('q'),rate=+f.get('rate')||p.buy,paid=+f.get('paid')||0;p.stock+=q;let total=q*rate,no=num('RT-PUR',db.purchases);db.purchases.push({no,date:today(),supplier:f.get('supplier'),product:p.name,qty:q,rate,total,paid});db.transactions.push({ref:num('PV',db.transactions),type:'Payment',party:f.get('supplier'),amount:paid,date:today()});save();go('purchase')}
function accounts(){let rec=db.transactions.filter(x=>x.type==='Receipt').reduce((s,x)=>s+x.amount,0),pay=db.transactions.filter(x=>x.type==='Payment').reduce((s,x)=>s+x.amount,0),exp=db.expenses.reduce((s,x)=>s+x.amount,0);content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Customer Receipts</div><div class="metric">${money(rec)}</div></div><div class="card"><div class="muted">Supplier Payments</div><div class="metric">${money(pay)}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">${money(exp)}</div></div><div class="card"><div class="muted">Net Cash Movement</div><div class="metric">${money(rec-pay-exp)}</div></div></div><div class="panel"><h2>Add Expense</h2><form onsubmit="addExpense(event)"><div class="formgrid"><div><label>Expense Head</label><input name="head" required></div><div><label>Amount</label><input name="amount" type="number" step=".01" required></div><div><label>Date</label><input name="date" type="date" value="${today()}"></div></div><button class="btn" style="margin-top:12px">Save Expense</button></form></div><div class="panel"><h2>Ledger</h2><table><tr><th>Ref</th><th>Type</th><th>Party/Head</th><th>Date</th><th>Amount</th></tr>${db.transactions.slice().reverse().concat(db.expenses.map(x=>({ref:x.ref,type:'Expense',party:x.head,date:x.date,amount:x.amount})).reverse()).map(x=>`<tr><td>${x.ref}</td><td>${x.type}</td><td>${x.party}</td><td>${x.date}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div>`}
function addExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.push({ref:num('EX',db.expenses),head:f.get('head'),amount:+f.get('amount'),date:f.get('date')});save();go('accounts')}
function reports(){let sales=db.invoices.reduce((s,x)=>s+x.total,0),purch=db.purchases.reduce((s,x)=>s+x.total,0),stock=db.products.reduce((s,x)=>s+x.stock*x.buy,0),gross=sales-purch;content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Sales</div><div class="metric">${money(sales)}</div></div><div class="card"><div class="muted">Purchases</div><div class="metric">${money(purch)}</div></div><div class="card"><div class="muted">Gross Movement</div><div class="metric">${money(gross)}</div></div><div class="card"><div class="muted">Stock Valuation</div><div class="metric">${money(stock)}</div></div></div><div class="panel"><h2>Stock Valuation Report</h2><table><tr><th>Code</th><th>Product</th><th>Stock</th><th>Purchase Rate</th><th>Stock Value</th></tr>${db.products.map(p=>`<tr><td>${p.code}</td><td>${p.name}</td><td>${p.stock}</td><td>${money(p.buy)}</td><td>${money(p.stock*p.buy)}</td></tr>`).join('')}</table></div><div class="panel"><h2>Due Summary</h2><p>Customer Due: <b>${money(db.invoices.reduce((s,x)=>s+x.total-x.paid,0))}</b></p><p>Supplier Due: <b>${money(db.purchases.reduce((s,x)=>s+x.total-x.paid,0))}</b></p></div>`}
function settings(){content.innerHTML=`<div class="panel"><h2>Company & Document Settings</h2><form onsubmit="saveSettings(event)"><div class="formgrid"><div><label>Company Name</label><input name="name" value="${db.company.name}"></div><div><label>Mobile</label><input name="mobile" value="${db.company.mobile}"></div><div><label>Email</label><input name="email" value="${db.company.email}"></div><div><label>BIN</label><input name="bin" value="${db.company.bin}"></div><div><label>TIN</label><input name="tin" value="${db.company.tin}"></div><div class="full"><label>Address</label><textarea name="address">${db.company.address}</textarea></div></div><button class="btn" style="margin-top:12px">Save Settings</button></form></div><div class="panel"><h2>Data Management</h2><button class="btn secondary" onclick="exportData()">Export Backup JSON</button> <button class="btn red" onclick="resetData()">Reset Demo Data</button><p class="muted" style="margin-top:12px">This V2 demo stores data in the browser. A production deployment needs a server database, secure authentication, backups and audit logs.</p></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);Object.assign(db.company,{name:f.get('name'),mobile:f.get('mobile'),email:f.get('email'),bin:f.get('bin'),tin:f.get('tin'),address:f.get('address')});save();alert('Settings saved');go('settings')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='rongdhanu_erp_backup.json';a.click()}
function resetData(){if(confirm('Reset all V2 demo data?')){localStorage.removeItem('rt_erp_v2');location.reload()}}
function toggle(id){document.getElementById(id).classList.toggle('hidden')}
function openModal(){modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
function preview(type,no){let data=db[type==='quotation'?'quotations':type==='invoice'?'invoices':'challans'].find(x=>x.no===no);if(!data)return;let lines=data.lines||[];let rows=lines.map((x,i)=>`<tr><td>${i+1}</td><td>${x.product}</td><td>${x.qty}</td><td>${x.rate?money(x.rate):''}</td><td>${x.rate?money(x.qty*x.rate):''}</td></tr>`).join('');let title=type==='quotation'?'PRICE OFFER / QUOTATION':type==='invoice'?'SALES INVOICE':data.type.toUpperCase();modalBody.innerHTML=`<div class="invoice-paper"><div class="invoice-head"><div><h1>${db.company.name}</h1><div>${db.company.tag}</div><div>${db.company.address}</div><div>${db.company.mobile} • ${db.company.email}</div></div><div class="right"><h2>${title}</h2><b>${data.no}</b><br>${data.date||today()}</div></div><p><b>Customer:</b> ${data.customer||''}<br><b>Project:</b> ${data.project||''}</p><table><tr><th>#</th><th>Description</th><th>Qty</th><th>Rate</th><th>Total</th></tr>${rows}</table>${type!=='challan'?`<div class="sum"><div class="totalrow"><span>Subtotal</span><b>${money(lines.reduce((s,x)=>s+x.qty*(x.rate||0),0))}</b></div><div class="totalrow"><span>Discount</span><b>${money(data.discount)}</b></div><div class="totalrow"><span>VAT</span><b>${data.vat||0}%</b></div><div class="totalrow grand"><span>Grand Total</span><b>${money(data.total)}</b></div>${type==='invoice'?`<div class="totalrow"><span>Paid</span><b>${money(data.paid)}</b></div><div class="totalrow"><span>Due</span><b>${money(data.total-data.paid)}</b></div>`:''}</div>`:''}<div class="sign"><span>Prepared By: __________________</span><span>Customer Signature: __________________</span></div></div><div class="form-actions no-print"><button class="btn" onclick="window.print()">Print / Save PDF</button></div>`;openModal()}
let content=document.getElementById('content'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');
if(sessionStorage.getItem('rt_role')){role=sessionStorage.getItem('rt_role');document.getElementById('roleLabel').textContent=role;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');buildNav();go('dashboard')}
</script>
</body></html>
